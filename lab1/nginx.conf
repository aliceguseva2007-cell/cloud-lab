# Группа серверов (наши два бэкенда)
upstream backend_pool {
    server backend1:5000;
    server backend2:5000;
}

# Зона для ограничения частоты запросов (5 запросов в секунду)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1r/s;

# Сервер для порта 80 (HTTP) - просто перенаправляет на HTTPS
server {
    listen 80;
    server_name myapp.local;
    return 301 https://$host$request_uri;
}

# Основной сервер для порта 443 (HTTPS)
server {
    listen 443 ssl;
    server_name myapp.local;

    # Пути к сертификатам (они будут внутри контейнера)
    ssl_certificate /etc/nginx/ssl/myapp.crt;
    ssl_certificate_key /etc/nginx/ssl/myapp.key;

    # Где лежит фронтенд
    root /usr/share/nginx/html;
    index index.html;

    # Кастомная страница 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Псевдоним (alias) для папки с документацией
    location /docs/ {
        alias /usr/share/nginx/docs/;
        index help.html;
    }

    # Проксирование запросов к API с балансировкой и лимитом
    location /api/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Защищенная паролем админка
    location /admin/ {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /usr/share/nginx/admin;
        index admin.html;
    }
}

# Второй виртуальный хост
server {
    listen 80;
    server_name other.local;
    root /usr/share/nginx/other;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}